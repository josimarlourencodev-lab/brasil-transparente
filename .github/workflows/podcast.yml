name: Podcast Semanal

on:
  schedule:
    # Segundas-feiras às 07h (UTC)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      emit_only:
        description: "Gera roteiro e áudio (sem gravar no Supabase)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LLM_PROVIDER: groq
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      PODCAST_LLM_MODEL: ${{ secrets.PODCAST_LLM_MODEL }}
      PODCAST_VOICE: ${{ secrets.PODCAST_VOICE }}
      PODCAST_DAYS: "7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scripts/requirements.lock.txt

      - name: Instalar dependências (cache do pip; leves)
        run: pip install -r scripts/requirements.lock.leve.txt

      - name: Checar autenticidade das dependências (leve)
        run: python scripts/security/check_deps.py -r scripts/requirements.lock.txt

      - name: Executar episódio do podcast
        run: python scripts/podcast.py

      - name: Notificar falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.warning("A geração do podcast falhou. Verifique os logs do job.")