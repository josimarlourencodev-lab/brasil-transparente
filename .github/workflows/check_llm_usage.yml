name: Verificar persistência do orçamento (Supabase)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependência HTTP
        run: pip install -r scripts/requirements.lock.leve.txt

      - name: Testar leitura e escrita na tabela llm_usage
        env:
          LLM_BUDGET_FILE: /tmp/budget.json
        run: |
          python - <<'PY'
          import os, sys, requests
          print("URL configurada        :", bool(os.environ.get("NEXT_PUBLIC_SUPABASE_URL")))
          print("service_role configurada:", bool(os.environ.get("SUPABASE_SERVICE_ROLE_KEY")))
          url = os.environ.get("NEXT_PUBLIC_SUPABASE_URL", "").strip().rstrip("/")
          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "").strip()

          r = requests.get(
              f"{url}/rest/v1/llm_usage",
              params={"select": "sum(tokens)", "criado_em": "gte.2000-01-01T00:00:00+00:00"},
              headers={"apikey": key, "Authorization": f"Bearer {key}"},
              timeout=10,
          )
          print("GET sum status         :", r.status_code)
          print("GET sum body           :", r.text[:500])

          r = requests.post(
              f"{url}/rest/v1/llm_usage",
              json={"tokens": 0},
              headers={"apikey": key, "Authorization": f"Bearer {key}", "Content-Type": "application/json", "Prefer": "return=minimal"},
              timeout=10,
          )
          print("POST status            :", r.status_code)
          print("POST body              :", r.text[:500])
          PY