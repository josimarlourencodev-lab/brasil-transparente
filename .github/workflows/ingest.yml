name: Ingestão de Notícias

on:
  schedule:
    # A cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rodar em modo simulação (não grava no banco)"
        type: boolean
        default: false
      sources:
        description: "Categorias de fontes (oficiais,imprensa,independentes ou vazio = todas)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      RSS_FEEDS_OFICIAIS: ${{ secrets.RSS_FEEDS_OFICIAIS }}
      RSS_FEEDS_IMPRENSA: ${{ secrets.RSS_FEEDS_IMPRENSA }}
      RSS_FEEDS_INDEPENDENTES: ${{ secrets.RSS_FEEDS_INDEPENDENTES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scripts/requirements.lock.txt

      - name: Instalar dependências (hashes verificados)
        run: pip install --require-hashes -r scripts/requirements.txt

      - name: Executar ingestão
        run: |
          SOURCES="${{ github.event.inputs.sources }}"
          DRY="${{ github.event.inputs.dry_run }}"
          ARGS=""
          if [ -n "$SOURCES" ]; then ARGS="$ARGS --sources $SOURCES"; fi
          if [ "$DRY" == "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/ingest.py $ARGS

      - name: Notificar falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.warning("A ingestão de notícias falhou. Verifique os logs do job.")